name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name MultiOutAudio
          --icon assets/icon.ico --add-data "multiout/icon.png;multiout" run_gui.py
      - name: Smoke test (exe starts and stays up)
        shell: pwsh
        run: |
          $p = Start-Process dist\MultiOutAudio.exe -PassThru
          Start-Sleep 6
          if ($p.HasExited) { throw "exe exited early with code $($p.ExitCode)" }
          Stop-Process $p -Force
      - name: Build installer
        shell: pwsh
        run: |
          $v = (Select-String -Path multiout\__init__.py -Pattern '"(.+)"').Matches[0].Groups[1].Value
          choco install innosetup -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\multiout.iss
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Out-File dist\SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes }
          gh release upload "${{ github.ref_name }}" dist\MultiOutAudio.exe dist\MultiOutAudio-Setup-*.exe dist\SHA256SUMS.txt --clobber
